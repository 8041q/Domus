<!doctype html><meta charset="utf-8"><title>Actual PlannerScene light-response review</title>
<style>body{margin:0;font:15px system-ui;background:#eee}header{padding:12px;display:flex;gap:18px;align-items:center}select{font:inherit;padding:6px}#viewport{width:min(100vw,1400px);height:calc(100vh - 65px)}canvas{display:block;width:100%;height:100%}pre{white-space:pre-wrap}</style>
<header><b>Actual PlannerScene — paired window suns</b><label>Diagnostic <select id="diagnostic"><option value="actual">Actual renderer</option><option value="legacy-pcf">Previous shadow sampling</option><option value="no-receive">Furniture shadow reception off</option><option value="no-sun-shadow">Sun shadows off</option><option value="normals">Furniture normals</option><option value="wireframe">Furniture wireframe</option><option value="clay">Neutral matte material</option></select></label><label>Camera <select id="camera-view"><option value="wide">Whole room</option><option value="front">C8c footboard close</option></select></label><button id="frame">Frame beds</button><label>Sun elevation <input id="elevation" type="number" value="19" min="5" max="75"></label></header><div id="viewport"></div><pre id="status">Loading actual renderer…</pre>
<script type="module">
import * as THREE from 'three';import {PlannerScene} from '../src/renderer/PlannerScene.ts';import {PRODUCT_LIST,PRODUCTS,productModelUrl} from '../src/core/products.ts';import {emptyRoomSnapshot} from '../src/store.ts';
const snapshot=emptyRoomSnapshot();const beds=['D8d','C8c'].map(name=>PRODUCT_LIST.find(p=>p.name.startsWith(name)));if(beds.some(p=>!p))throw new Error('Missing beds');if(new URLSearchParams(location.search).has('candidate')){const p=beds[1];const replacement={...p,model:{...p.model,runtimeUrl:'http://127.0.0.1:5198/review-assets/'+(new URLSearchParams(location.search).get('stage')??'candidate')+'.glb?model=C8c&v='+Date.now()}};PRODUCTS[p.id]=replacement;PRODUCT_LIST[PRODUCT_LIST.findIndex(item=>item.id===p.id)]=replacement;beds[1]=replacement;}snapshot.objects=beds.map((p,i)=>({id:'bed-'+i,productId:p.id,x:1.8+i*1.4,z:1.9,rotationY:0}));snapshot.showRoomDimensions=false;snapshot.showProductDimensions=false;snapshot.showSpacingDimensions=false;snapshot.room.lighting.sunElevation=19;Object.assign(snapshot.openings.find(o=>o.type==='window'),{wallId:'wall-v2-v3',offset:2.9,width:1.6,height:1.8,sillHeight:.5});
const scene=new PlannerScene(document.querySelector('#viewport'),{getSnapshot:()=>snapshot,select(){},selectOpening(){},updateObject(){},updateOpening(){},commitDrag(){},feedback(){}},{showFurniture:true,interactiveFurniture:false,interactiveArchitecture:false,sunRays:true});

function frame(){scene.controls.enableDamping=false;scene.camera.fov=38;scene.camera.updateProjectionMatrix();if(document.querySelector('#camera-view').value==='front'){scene.camera.position.set(3.3,1.05,4.05);scene.controls.target.set(3.2,.6,2.95);}else{scene.camera.position.set(2.8,2.7,4.7);scene.controls.target.set(2.5,.5,1.9);}scene.controls.update();scene.requestRender();}frame();
const originals=new Map();scene.objectGroup.traverse(n=>{if(n.isMesh)originals.set(n,{material:n.material,receiveShadow:n.receiveShadow});});const productionShadowType=scene.renderer.shadowMap.type;const normalMaterials=new Map(),wire=new THREE.MeshBasicMaterial({color:0x333333,wireframe:true}),clay=new THREE.MeshStandardMaterial({color:0xbbbbbb,roughness:.7,metalness:0});
function render(){const mode=document.querySelector('#diagnostic').value;scene.objectGroup.traverse(n=>{if(!n.isMesh)return;if(!originals.has(n))originals.set(n,{material:n.material,receiveShadow:n.receiveShadow});const original=originals.get(n);n.receiveShadow=mode==='no-receive'?false:original.receiveShadow;if(mode==='normals'){const convert=m=>{if(!normalMaterials.has(m))normalMaterials.set(m,new THREE.MeshNormalMaterial({side:m.side,normalMap:m.normalMap??null,normalScale:m.normalScale?.clone()}));return normalMaterials.get(m);};n.material=Array.isArray(original.material)?original.material.map(convert):convert(original.material);}else n.material=mode==='wireframe'?wire:mode==='clay'?clay:original.material;});for(const light of scene.sunsetLights??[]){light.castShadow=mode!=='no-sun-shadow';light.shadow.needsUpdate=true;}scene.renderer.shadowMap.type=mode==='legacy-pcf'?THREE.PCFShadowMap:productionShadowType;scene.scene.traverse(n=>{if(n.isMesh)for(const m of Array.isArray(n.material)?n.material:[n.material])m.needsUpdate=true;});scene.invalidateShadows();scene.requestRender();document.querySelector('#status').textContent=JSON.stringify({mode,loaded:[...scene.objectModels.values()].map(g=>Boolean(g.userData.productModelLoaded)),shadowFilter:scene.renderer.shadowMap.type,pending:scene.productModelRequests.size,errors:[...scene.productModelErrors],models:beds.map(p=>({name:p.name,url:productModelUrl(PRODUCTS[p.id])})),lighting:snapshot.room.lighting,sunMaps:scene.sunsetLights?.map(l=>({size:l.shadow.mapSize.toArray(),radius:l.shadow.radius,normalBias:l.shadow.normalBias}))},null,2);}
document.querySelector('#frame').onclick=()=>{frame();render();};document.querySelector('#diagnostic').onchange=render;document.querySelector('#camera-view').onchange=()=>{frame();render();};document.querySelector('#elevation').onchange=()=>{snapshot.room.lighting.sunElevation=+document.querySelector('#elevation').value;scene.syncSunset(snapshot);render();};render();const ready=setInterval(()=>{if(scene.productModelRequests.size===0){clearInterval(ready);render();}},200);
</script>
