<!doctype html><html lang="en"><meta charset="utf-8"><title>Domus opening model review</title>
<style>body{margin:0;background:#d4d5d6;color:#202629;font:15px system-ui}header{padding:14px 24px;background:#fff}h1{font-size:20px;margin:0 0 10px}select,input,button{font:inherit;padding:6px;margin-right:12px}.columns{display:flex;width:1200px}.columns div{width:400px;padding:12px 0;text-align:center}canvas{display:block}#status{padding:8px 24px}#room{width:1200px;height:600px}label{margin-right:12px}</style>
<header><h1>Door and window inspection</h1><label>Model <select id="model"></select></label><label>Width <input id="width" type="number" step=".05" min=".45" style="width:70px"></label><label>Height <input id="height" type="number" step=".05" min=".4" style="width:70px"></label><label>Inspect <select id="focus"><option value="full">Full model</option><option value="handle">Handle close-up</option><option value="frame">Frame joint close-up</option><option value="left-frame">Left jamb close-up</option><option value="right-frame">Right jamb close-up</option></select></label><button id="back">Reverse view</button><button id="roomButton">Show selected in room</button></header>
<div id="status">Loading…</div><div class="columns"><div>Original proportions / materials</div><div>Whole-object stretch</div><div>Corrected insert</div></div><div id="studio"></div><p><a id="download" download="opening-comparison.png">Download this comparison</a> · <button id="sheet">Build comparison sheet for all nine models</button><button id="defects">Build stretched detail comparisons</button><button id="benchmark">Measure selected antialiasing cost</button></p><p id="performance"></p><div id="room"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
import {ProductModelLibrary} from '../src/renderer/productModels.ts';
import {OPENING_MODELS,fitOpeningModel} from '../src/renderer/openingModels.ts';
import {prepareOpeningAsset} from '../src/renderer/openingMaterials.ts';
import {PlannerScene} from '../src/renderer/PlannerScene.ts';
import {emptyRoomSnapshot} from '../src/store.ts';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,430);renderer.toneMapping=THREE.NeutralToneMapping;renderer.toneMappingExposure=.98;document.querySelector('#studio').append(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer),environment=pmrem.fromScene(new RoomEnvironment(),.04);
const library=new ProductModelLibrary();library.setEnvironment(environment.texture);
const correctedLibrary=new ProductModelLibrary(undefined,prepareOpeningAsset);correctedLibrary.setEnvironment(environment.texture);correctedLibrary.setOpeningEnvironment(environment.texture);
const select=document.querySelector('#model'),width=document.querySelector('#width'),height=document.querySelector('#height');
const presets={'single-window':[1.2,1.2],'double-window':[1.8,1.25],'single-hung-window':[1.2,1.35],'high-window':[1.35,.65],'sliding-window':[2.4,2.6],'single-door':[.9,2.08],'glass-door':[.9,2.08],'semi-glass-door':[.9,2.08],'glass-double-door':[1.6,2.08]};
for(const [i,variant] of Object.keys(OPENING_MODELS).entries())select.add(new Option(`${i+1}. ${variant}`,variant));
let flipped=false,roomScene,serial=0;
function inspectTarget(model,variant){const box=new THREE.Box3().setFromObject(model,true);const focus=document.querySelector('#focus').value;if(focus.endsWith('-frame'))return new THREE.Vector3(focus==='left-frame'?box.min.x+.10:box.max.x-.10,(box.min.y+box.max.y)/2,0);if(document.querySelector('#focus').value==='frame')return new THREE.Vector3(0,box.max.y-.06,0);let handle;model.traverse(node=>{if(!node.isMesh)return;const material=Array.isArray(node.material)?node.material[0]:node.material;if((variant==='single-door'&&material.name==='Metal black')||(/^(glass-door|high-window)$/.test(variant)&&node.name.startsWith('Plane'))||(variant==='semi-glass-door'&&/^Cylinder\.?001$/.test(node.name))||(/handle|hardware/i.test(node.name)))handle??=node;});return handle?new THREE.Box3().setFromObject(handle,true).getCenter(new THREE.Vector3()):box.getCenter(new THREE.Vector3());}
function oldFit(model,variant,w,h){const oriented=new THREE.Group();oriented.rotation.y=OPENING_MODELS[variant].rotationY??0;oriented.add(model);oriented.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(oriented,true),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());oriented.position.set(-c.x,-b.min.y,-c.z);const root=new THREE.Group();root.add(oriented);root.scale.set(w/s.x,h/s.y,1);return root;}
async function render(){const ticket=++serial,variant=select.value,definition=OPENING_MODELS[variant];document.querySelector('#status').textContent='Loading '+variant;const template=await library.loadModel('/internal/architecture/openings/'+definition.file);if(ticket!==serial)return;
 const oriented=new THREE.Group();oriented.rotation.y=definition.rotationY??0;oriented.add(library.instantiate(template));oriented.updateMatrixWorld(true);const source=new THREE.Box3().setFromObject(oriented,true).getSize(new THREE.Vector3());
 const w=+width.value,h=+height.value;
 const correctedTemplate=await correctedLibrary.loadModel('/internal/architecture/openings/'+definition.file);
 if(ticket!==serial)return;
 const models=[oldFit(library.instantiate(template),variant,source.x,source.y),oldFit(library.instantiate(template),variant,w,h),fitOpeningModel(correctedLibrary.instantiate(correctedTemplate),variant,w,h)];
 renderer.setScissorTest(true);for(const [i,model]of models.entries()){const scene=new THREE.Scene();scene.background=new THREE.Color('#d4d5d6');scene.add(model);scene.add(new THREE.HemisphereLight(0xf7f8fa,0xb8b4ae,1.15),new THREE.AmbientLight(0xffffff,.38));const key=new THREE.DirectionalLight(0xfff6eb,.82);key.position.set(4.2,7.2,4.8);scene.add(key);const fill=new THREE.DirectionalLight(0xe9edf0,.34);fill.position.set(-4.5,5.2,-4.2);scene.add(fill);const camera=new THREE.PerspectiveCamera(32,400/430,.01,50);if(document.querySelector('#focus').value==='full'){const distance=Math.max(5.8,Math.max(source.x,w)*2.2,Math.max(source.y,h)*2);const centreY=Math.max(source.y,h)/2;camera.position.set(flipped?-distance*.2:distance*.2,centreY+.25,flipped?-distance:distance);camera.lookAt(0,centreY,0);}else{const target=inspectTarget(model,variant);camera.position.copy(target).add(new THREE.Vector3(.15,.04,flipped?-1.05:1.05));camera.lookAt(target);}renderer.setViewport(i*400,0,400,430);renderer.setScissor(i*400,0,400,430);renderer.render(scene,camera);}
 document.querySelector('#status').textContent=`${variant} — source ${source.x.toFixed(3)} × ${source.y.toFixed(3)} m; opening ${w.toFixed(2)} × ${h.toFixed(2)} m; ${flipped?'rear':'front'} view`;
 const evidence=document.createElement('canvas');evidence.width=1200;evidence.height=500;const context=evidence.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,1200,500);context.fillStyle='#202629';context.font='18px system-ui';context.fillText(`${variant} — ${w.toFixed(2)} × ${h.toFixed(2)} m`,20,25);['Original proportions / materials','Whole-object stretch','Corrected insert'].forEach((label,i)=>context.fillText(label,i*400+20,57));context.drawImage(renderer.domElement,0,70);document.querySelector('#download').href=evidence.toDataURL();
 for(const model of models)model.traverse(node=>{if(node.isMesh&&node.userData.openingInstanceGeometry)node.geometry.dispose();});
 if(roomScene){roomScene.dispose();roomScene=null;await showRoom();}
}
async function showRoom(){const snapshot=emptyRoomSnapshot();snapshot.openings=[{id:'review',type:select.value.endsWith('window')?'window':'door',variant:select.value,wallId:'wall-v0-v1',offset:2.5,width:+width.value,height:+height.value,sillHeight:0}];snapshot.room.baseboardColor='#354653';snapshot.objects=[];snapshot.selectedOpeningId='review';roomScene=new PlannerScene(document.querySelector('#room'),{getSnapshot:()=>snapshot,select(){},selectOpening(){},updateObject(){},updateOpening(){},commitDrag(){},feedback(){}},{showFurniture:false,interactiveFurniture:false,interactiveArchitecture:true,sunRays:false});roomScene.camera.fov=50;roomScene.camera.updateProjectionMatrix();roomScene.camera.position.set(2.5,1.25,2.8);roomScene.controls.target.set(2.5,1.05,0);roomScene.controls.update();roomScene.requestRender();}
select.onchange=()=>{[width.value,height.value]=presets[select.value];render();};width.oninput=height.oninput=width.onchange=height.onchange=render;document.querySelector('#focus').onchange=render;document.querySelector('#back').onclick=()=>{flipped=!flipped;render();};document.querySelector('#roomButton').onclick=()=>{if(!roomScene)showRoom();};
async function buildSheet(cases,name){if(roomScene){roomScene.dispose();roomScene=null;}const sheet=document.createElement('canvas');sheet.width=1200;sheet.height=cases.length*500;const context=sheet.getContext('2d');for(const [i,[variant,w,h,focus]]of cases.entries()){select.value=variant;width.value=w;height.value=h;document.querySelector('#focus').value=focus;await render();const image=new Image();image.src=document.querySelector('#download').href;await image.decode();context.drawImage(image,0,i*500);}document.querySelector('#download').href=sheet.toDataURL();document.querySelector('#download').download=name+'.png';document.querySelector('#download').textContent='Download '+name;}
document.querySelector('#sheet').onclick=()=>buildSheet(Object.keys(OPENING_MODELS).map(variant=>[variant,...presets[variant],'full']),'opening-model-comparisons');
document.querySelector('#defects').onclick=()=>buildSheet([['single-door',3.55,1.63,'handle'],['semi-glass-door',3.55,1.63,'full'],['glass-door',.9,1.63,'handle'],['double-window',3.55,.8,'frame'],['high-window',3.55,.65,'right-frame']],'opening-stretched-details');
document.querySelector('#benchmark').onclick=async()=>{if(!roomScene)await showRoom();await roomScene.productModels.loadModel('/internal/architecture/openings/'+OPENING_MODELS[select.value].file);await new Promise(requestAnimationFrame);const current=roomScene,gl=current.renderer.getContext(),samples=Math.min(4,current.renderer.capabilities.maxSamples),results=[];const setSamples=count=>{for(const target of [current.composer.renderTarget1,current.composer.renderTarget2]){target.dispose();target.samples=count;}};for(const count of [0,samples]){setSamples(count);for(let i=0;i<5;i++)current.composer.render();gl.finish();const start=performance.now();for(let i=0;i<30;i++)current.composer.render();gl.finish();results.push((performance.now()-start)/30);}setSamples(samples);current.requestRender();document.querySelector('#performance').textContent=`Selected room, same pixel budget: no MSAA ${results[0].toFixed(2)} ms/frame; ${samples}× MSAA ${results[1].toFixed(2)} ms/frame (CPU + GPU, local device).`;};
await Promise.all(Object.values(OPENING_MODELS).flatMap(definition=>[library.loadModel('/internal/architecture/openings/'+definition.file),correctedLibrary.loadModel('/internal/architecture/openings/'+definition.file)]));
select.onchange();
</script></html>
