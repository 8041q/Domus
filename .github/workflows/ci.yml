name: Verify Domus
on: [push, pull_request]
jobs:
  test-chromium:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-v${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-v${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - run: npx playwright install chromium
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:e2e -- tests/browser/interior-walls.spec.ts --project=chromium
        env:
          VITE_DOMUS_INTERIOR_WALLS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-chromium
          path: test-results/

  test-webkit:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-v${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-v${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-webkit-
      - run: npx playwright install webkit
      - run: npm run test:e2e -- --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-webkit
          path: test-results/

  firefox:
    # Give Firefox's WebGL2 tests an explicit graphics backend on hosted runners.
    # Use Mesa software rendering with a virtual display; retain the full suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Install Mesa software graphics
        run: sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0
      - run: xvfb-run --auto-servernum npm run test:e2e -- --project=firefox --headed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-firefox
          path: test-results/

  planning-proxies:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'planning_model_*_test.py'
      - run: brew install --cask blender
      - run: node --test tests/planningProxies.test.mjs
        env:
          DOMUS_TEST_BLENDER: /Applications/Blender.app/Contents/MacOS/Blender
