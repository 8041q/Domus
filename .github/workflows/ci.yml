name: Verify Domus
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:e2e -- tests/browser/interior-walls.spec.ts --project=chromium
        env:
          VITE_DOMUS_INTERIOR_WALLS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  planning-proxies:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'planning_model_*_test.py'
      - run: brew install --cask blender
      - run: node --test tests/planningProxies.test.mjs
        env:
          DOMUS_TEST_BLENDER: /Applications/Blender.app/Contents/MacOS/Blender
